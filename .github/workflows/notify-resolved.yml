name: Notify reporter on resolve

# Stuurt automatisch een "je melding is opgelost"-mail naar de indiener zodra
# een feedback-issue wordt gesloten als "completed" (voltooid). Het mailen zelf
# gebeurt in api/notify-resolved.js: daar staat het e-mailadres van de melder
# privé opgeslagen (niet meer in de publieke issue-body).

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >
      contains(github.event.issue.labels.*.name, 'feedback') &&
      github.event.issue.state_reason == 'completed'
    steps:
      - name: Melder mailen
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          curl -fsS -X POST https://studiomichielboesveldt.nl/api/notify-resolved \
            -H 'Content-Type: application/json' \
            -d "{\"issue\": ${ISSUE_NUMBER}}"
